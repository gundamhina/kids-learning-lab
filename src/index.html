<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#26647E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<title>Kids Learning Lab</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="watercolor" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- 按鈕、面板用：抖得比卡片小一點，範圍留大一點，下面的硬陰影才不會被切掉 -->
    <filter id="wobble" x="-12%" y="-12%" width="124%" height="136%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div id="install-hint" hidden>手機請用 Chrome 開，再從選單「加到主畫面」，就會是全螢幕。點這裡關掉。</div>
<div id="version" aria-hidden="true">__VERSION__</div>
<div id="stage">
  <section class="screen" id="screen-profiles"></section>
  <section class="screen" id="screen-home"></section>
  <section class="screen" id="screen-game">
    <div class="play-area"></div>
    <div class="topbar">
      <div class="tb-left">
        <button class="round-btn quit" id="btn-quit" aria-label="回首頁">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="#fff"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg>
        </button>
        <button class="round-btn quit" id="btn-help" aria-label="怎麼玩">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="#fff"><path d="M11 18h2v-2h-2v2zm1-16a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm0-14a4 4 0 0 0-4 4h2a2 2 0 1 1 4 0c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5a4 4 0 0 0-4-4z"/></svg>
        </button>
      </div>
      <button class="round-btn" id="btn-replay" aria-label="再聽一次">
        <svg viewBox="0 0 24 24" width="60" height="60" fill="#fff"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      </button>
    </div>
    <div class="progress-stars"></div>
    <div class="bones-pill" id="bones"><span class="bone-ic"></span><b>0</b></div>
    <div class="combo" id="combo" hidden><span class="flame"></span><b>2</b></div>
  </section>
  <section class="screen" id="screen-shop"></section>
  <section class="screen" id="screen-battle"></section>
  <section class="screen" id="screen-result"></section>
  <section class="screen" id="screen-panel"></section>
</div>
<script>
/*__JS__*/
</script>
</body>
</html>
